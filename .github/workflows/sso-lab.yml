name: Isolated SSO integration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  synthetic-sso:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate fictitious identities and scoped lab CA
        run: python infrastructure/monitoring/sso-lab.py prepare
      - run: python infrastructure/monitoring/sso-lab-server-profile.py --prepare-only
      - name: Assign only synthetic fixture ownership
        run: sudo python3 tools/lab_permissions.py
      - name: Real MFA, TLS, native OAuth and session expiry
        run: python infrastructure/monitoring/sso-lab-server-profile.py --run-prepared --expiry
      - name: Stop only the isolated lab, retain its data
        if: always()
        run: python infrastructure/monitoring/sso-lab.py stop
